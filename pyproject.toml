[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "approval-lab"
version = "0.1.0"
description = "Local command-approval model benchmarks, relay cost tracking, and regression monitoring."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "httpx>=0.27,<1",
  "cryptography>=43",
  "tzdata>=2024.2",
  "pystray>=0.19.5,<0.20; sys_platform == 'win32'",
  "Pillow>=12,<13; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]
browser = ["playwright>=1.48,<2"]

[project.scripts]
approval-lab = "approval_lab.__main__:main"

[project.urls]
Repository = "https://github.com/xxuxiaoo/approval-lab"
Issues = "https://github.com/xxuxiaoo/approval-lab/issues"

[tool.setuptools.packages.find]
include = ["approval_lab*"]

[tool.setuptools.package-data]
approval_lab = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"
